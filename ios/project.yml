name: Attention
options:
  developmentLanguage: en
  bundleIdPrefix: com.yjmeqt
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M3V5P234X3
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    APP_GROUP_ID: group.$(APP_BUNDLE_ID).shared
    # The library syncs through this container's private database, on iOS and macOS alike.
    CLOUDKIT_CONTAINER_ID: iCloud.$(APP_BUNDLE_ID)
  configs:
    Debug:
      APP_BUNDLE_ID: com.yjmeqt.attn.dev
      APP_DISPLAY_NAME: Attention Dev
    Release:
      APP_BUNDLE_ID: com.yjmeqt.attn
      APP_DISPLAY_NAME: Attention

targets:
  Attention:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Attention.icon]
      - path: App/Attention.icon
        type: file
        buildPhase: resources
      - Shared
    dependencies:
      - target: AttentionExtension
    entitlements:
      path: App/Attention.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        # Silent pushes tell the library there's something new in iCloud.
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        CloudKitContainerID: $(CLOUDKIT_CONTAINER_ID)
        UIBackgroundModes: [remote-notification]
        NSPhotoLibraryAddUsageDescription: Save link cards to your photo library.
        NSCameraUsageDescription: Scan a QR code to get its link.
        NSFaceIDUsageDescription: Unlock your private items.
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [INSendMessageIntent]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: Attention
    scheme:
      testTargets: [AttentionTests]

  AttentionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Attention
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  # Mac app: a library window plus a menu bar item. Shares the library, unfurler, card templates and feed tiles
  # with iOS; its windows and menus are its own (Mac/).
  AttentionMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Mac
      - path: App/Attention.icon
        type: file
        buildPhase: resources
      - Shared/Model.swift
      - Shared/Platform.swift
      - Shared/Unfurler.swift
      - Shared/ItemProviders.swift
      - Shared/Card
      - Shared/Intake
      - Shared/Library/Library.swift
      - Shared/Library/LibraryItem.swift
      - Shared/Library/ImageData.swift
      - Shared/Features/Feed.swift
      - Shared/Features/FeedFilter.swift
      - Shared/Features/CardControls.swift
      - Shared/Features/TagEditor.swift
      - Shared/Features/Opening.swift
      - Shared/Localizable.xcstrings
      - App/PrivacyInfo.xcprivacy
    entitlements:
      path: Mac/AttentionMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        CloudKitContainerID: $(CLOUDKIT_CONTAINER_ID)
        NSFaceIDUsageDescription: Unlock your private items.
    settings:
      base:
        PRODUCT_NAME: Attention
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: Attention
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}

  AttentionExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    entitlements:
      path: ShareExtension/AttentionExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSPhotoLibraryAddUsageDescription: Save link cards to your photo library.
        NSFaceIDUsageDescription: Unlock your private items.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
