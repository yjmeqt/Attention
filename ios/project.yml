name: Attention
options:
  developmentLanguage: en
  bundleIdPrefix: com.yjmeqt
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M3V5P234X3
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    APP_GROUP_ID: group.$(APP_BUNDLE_ID).shared
  configs:
    Debug:
      APP_BUNDLE_ID: com.yjmeqt.attn.dev
      APP_DISPLAY_NAME: Attention Dev
    Release:
      APP_BUNDLE_ID: com.yjmeqt.attn
      APP_DISPLAY_NAME: Attention

targets:
  Attention:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Attention.icon]
      - path: App/Attention.icon
        type: file
        buildPhase: resources
      - Shared
    dependencies:
      - target: AttentionExtension
    entitlements:
      path: App/Attention.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSPhotoLibraryAddUsageDescription: Save link cards to your photo library.
        NSCameraUsageDescription: Scan a QR code to get its link.
        NSFaceIDUsageDescription: Unlock your private items.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: Attention
    scheme:
      testTargets: [AttentionTests]

  AttentionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Attention
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  AttentionExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    entitlements:
      path: ShareExtension/AttentionExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSPhotoLibraryAddUsageDescription: Save link cards to your photo library.
        NSFaceIDUsageDescription: Unlock your private items.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
