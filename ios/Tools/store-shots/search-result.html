<!doctype html>
<html><head><meta charset="utf-8"><title>Attention Search Result</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;900&family=Noto+Sans+TC:wght@400;900&display=swap">
<style>
/* App Store search result creative, 3:2. Laid out at 1200×800 CSS px, captured at 3.2× for 3840×2560.
   Same story as the first screenshot and the header: a bare link in a chat bubble, struck out, becomes a card.
   The card is the locale's real export (raw/<locale>/card.png, cropped by export.js). */
:root { --paper: #ece2cd; --ink: #111; --red: #d4261b; --white: #fbf7ee; }
* { box-sizing: border-box; }
html, body { margin: 0; }
#art { position: relative; width: 1200px; height: 800px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
:lang(zh-Hant) #art { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
.tri { position: absolute; right: -8%; bottom: -12%; width: 62%; height: 96%; background: var(--red); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.bar { position: absolute; left: -10%; top: 70%; width: 80%; height: 18px; background: var(--ink); transform: rotate(-14deg); }
.copy { position: absolute; left: 70px; top: 96px; width: 600px; }
h1 { margin: 0; font-weight: 900; font-size: 94px; line-height: 1.04; letter-spacing: -.01em; transform: rotate(-6deg); transform-origin: left top; }
h1 span { display: block; color: var(--red); }
:lang(zh) h1 { font-size: 104px; line-height: 1.14; letter-spacing: .02em; }
p { margin: 56px 0 0; max-width: 470px; font-size: 30px; line-height: 1.45; font-weight: 400; }
:lang(zh) p { font-size: 30px; max-width: 600px; }
/* The bare link: a generic chat bubble with a YouTube short link and a friend's reply. */
.bubble { position: absolute; right: 150px; top: 58px; background: #fff; border-radius: 22px; padding: 20px 26px; font: 30px/1.3 -apple-system, "PingFang SC", sans-serif; color: #2a5db0; box-shadow: 0 18px 36px -20px #0007; transform: rotate(-3deg); }
.bubble small { display: block; margin-top: 6px; color: #8a8a8a; font-size: 22px; }
.bubble b { position: absolute; right: -20px; top: -20px; width: 48px; height: 48px; border-radius: 50%; background: var(--red); color: #fff; font: 900 28px/48px "Noto Sans SC", sans-serif; text-align: center; }
.arrow { position: absolute; right: 450px; top: 220px; width: 120px; height: 34px; transform: rotate(48deg); background: var(--ink); clip-path: polygon(0 35%, 70% 35%, 70% 0, 100% 50%, 70% 100%, 70% 65%, 0 65%); }
.card { position: absolute; right: 70px; top: 238px; width: 360px; border-radius: 20px; box-shadow: 0 30px 50px -22px #000c; transform: rotate(4deg); display: block; }
</style></head>
<body><main id="art"><span class="tri"></span><span class="bar"></span>
<div class="copy"><h1></h1><p></p></div>
<div class="bubble">youtu.be/aircAruvnKk<small></small><b>✕</b></div>
<span class="arrow"></span>
<img class="card" alt="">
</main>
<script src="copy.js"></script>
<script>
// ?locale=<fastlane locale>; only the card locales, whose first screenshot is the bare-link comparison.
const locale = new URLSearchParams(location.search).get("locale") || "en-US";
if (!COPY[locale] || COPY[locale][0][2] !== "compare") throw new Error(`Not a card locale: ${locale}`);
document.documentElement.lang = locale.startsWith("zh") ? locale : "en";
// The headline and subline are the first screenshot's, so the three creatives say the same thing.
const [head, sub] = COPY[locale][0];
document.querySelector("h1").innerHTML = head.replace(/<br>/g, "").replace(/\s*<span>/, "<span>");
document.querySelector("p").textContent = sub.replace(/。/, "。\n");
document.querySelector("p").style.whiteSpace = "pre-line";
document.querySelector(".bubble small").textContent = { "zh-Hans": "好友：这是什么？", "zh-Hant": "朋友：這是什麼？" }[locale] || "Friend: what is this?";
document.querySelector(".card").src = `../../fastlane/raw/${locale}/card.png`;
</script></body></html>
